# Same fixes as shell/rc.bash, for every pane this server starts.
set-environment -g GIT_ASKPASS /bin/coder
set-environment -g GIT_SSH_COMMAND "/bin/coder gitssh --"
set-environment -gu GITHUB_TOKEN

# Remote attach: size to the client actually looking, keep long scrollback.
set -g aggressive-resize on
set -g history-limit 100000
set -g mouse on
set -s escape-time 0
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S:#W (#{host})"
set -g status-right "#{host} %H:%M "
